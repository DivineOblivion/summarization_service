[tool.pytest.ini_options]
pythonpath = [".", "summarization_service"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = [
  "summarization_service",
  "tests",
] # Настройка файлов для обработки coverage

[tool.coverage.paths]
source = ["summarization_service"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:"]
show_missing = true

[tool.ruff]
show-fixes = true
target-version = "py312"
src = ["summarization_service", "tests"] # first-party

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
  "F", # pyflakes 
  # "E",   # pycodestyle 
  "W", # pycodestyle 
  # "C90", # mccabe 
  "I", # isort
  # "N",   # pep8-naming
  # "D",     # pydocstyle
  "UP",    #  pyupgrade 
  "YTT",   # flake8-2020
  "ASYNC", # flake8-async
  "S",     # flake8-bandit
  "BLE",   # flake8-blind-except
  "FBT",   # flake8-boolean-trap
  "B",     # flake8-bugbear
  "A",     # flake8-builtins
  "COM",   # flake8-commas
  "CPY",   # flake8-copyright
  "C4",    # flake8-comprehensions
  "DTZ",   # flake8-datetimez
  "T10",   # flake8-debugger
  "EM",    # flake8-errmsg
  "EXE",   # flake8-executable
  "FA",    # flake8-future-annotations
  "ISC",   # flake8-implicit-str-concat
  "ICN",   # flake8-import-conventions
  "LOG",   # flake8-logging
  "G",     # flake8-logging-format
  "INP",   # flake8-no-pep420 
  "PIE",   # flake8-pie
  # "T20",   # flake8-print
  "PYI", # flake8-pyi
  "PT",  # flake8-pytest-style
  "Q",   # flake8-quotes
  "RSE", # flake8-raise
  # "RET",   # flake8-return 
  "SLF",  # flake8-self
  "SLOT", # flake8-slots 
  "SIM",  # flake8-simplify
  # "TID",   # flake8-tidy-imports
  "TCH", # flake8-type-checking
  "INT", # flake8-gettext
  # "ARG",   # flake8-unused-arguments
  "PTH", # flake8-use-pathlib
  "TD",  # flake8-todos
  "FIX", # flake8-fixme
  # "ERA",   # eradicate 
  "PGH", # pygrep-hooks
  # "PL",    # pylint 
  # "R",     # refactor 
  "TRY", # tryceratops 
  "FLY", # flynt 
  "NPY", # numpy-specific rules
  # "PERF",  # perflint 
  "FURB", # refurb 
  "DOC",  # pydoclint 
  # "RUF",   # ruff-specific rules
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.params.Depends",
  "fastapi.Query",
  "fastapi.params.Query",
]

[tool.mypy]
check_untyped_defs = true
ignore_missing_imports = true
files = ["summarization_service", "tests"] # Настройка файлов для обработки
